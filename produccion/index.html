<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somos Producción - Calendar</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas CDN for capturing HTML elements as images -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- jsPDF CDN for generating PDF documents -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
        <a href="../index.html" class="floating-home-btn">🏠 Inicio</a>

    <div class="container">
        <div class="logo-header">
            <!-- Placeholder for logo_letras_comunidad_somos.PNG -->
            <!-- In a real project, this would be: <img src="img/logo_letras_comunidad_somos.PNG" alt="Logo Somos Comunidad Cristiana"> -->

        </div>
        <h1>
            <!-- SVG Icon -->

            Producción
        </h1>
        <div class="main-columns-layout">
            <!-- Grupo de Columnas de Mesas (Viernes y Domingo) -->
            <div class="tables-column-group">
                <!-- Columna Viernes -->
                <div class="column" id="friday-column">
                    <h2>
                        Viernes
                        <div class="date-time-inputs">
                            <input type="date" id="friday-date">
                            <input type="time" id="friday-time">
                        </div>
                    </h2>
                    <div class="available-collaborators">
                        <h3>Colaboradores disponibles:</h3>
                        <div class="collaborators-grid">
                            <div class="draggable-item" data-name="Lato" draggable="true">Lato</div>
                            <div class="draggable-item" data-name="Herlan" draggable="true">Herlan</div>
                            <div class="draggable-item" data-name="Santi-Jair" draggable="true">Santi (Jair)</div>
                            <div class="draggable-item" data-name="Abigail" draggable="true">Abigaíl</div>
                            <div class="draggable-item" data-name="Yoesmith" draggable="true">Yoesmith</div>
                            <div class="draggable-item" data-name="Andrea" draggable="true">Andrea</div>
                            <div class="draggable-item" data-name="Israel" draggable="true">Israel</div>
                            <div class="draggable-item" data-name="Josue" draggable="true">Josué</div>
                            <div class="draggable-item" data-name="Johan" draggable="true">Johan</div>
                        </div>
                    </div>
                    <div class="drop-zone"></div>
                </div>

                <!-- Columna Domingo -->
                <div class="column" id="sunday-column">
                    <h2>
                        Domingo
                        <div class="date-time-inputs">
                            <input type="date" id="sunday-date">
                            <input type="time" id="sunday-time">
                        </div>
                    </h2>
                    <div class="available-collaborators">
                        <h3>Colaboradores disponibles:</h3>
                        <div class="collaborators-grid">
                            <div class="draggable-item" data-name="Lato" draggable="true">Lato</div>
                            <div class="draggable-item" data-name="Herlan" draggable="true">Herlan</div>
                            <div class="draggable-item" data-name="Santi-Jair" draggable="true">Santi (Jair)</div>
                            <div class="draggable-item" data-name="Abigail" draggable="true">Abigaíl</div>
                            <div class="draggable-item" data-name="Yoesmith" draggable="true">Yoesmith</div>
                            <div class="draggable-item" data-name="Andrea" draggable="true">Andrea</div>
                            <div class="draggable-item" data-name="Israel" draggable="true">Israel</div>
                            <div class="draggable-item" data-name="Josue" draggable="true">Josué</div>
                            <div class="draggable-item" data-name="Johan" draggable="true">Johan</div>
                        </div>
                    </div>
                    <div class="drop-zone"></div>
                </div>
            </div>
        </div>
        <!-- Observations Section -->
        <div class="observations-section" id="observations-section">
            <h3>Observaciones</h3>
            <div id="observations-container"></div>
        </div>

        <button class="print-all-button" onclick="printAllColumnsToPdf()">Generar (PDF)</button>
    </div>

    <!-- Message Box for user feedback -->
    <div id="message-box"></div>

<script src="script.js" language="javascript" type="text/javascript"></script>

</body>
</html>
